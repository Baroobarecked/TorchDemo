services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rag_pgdata:
